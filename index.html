<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembaruan DATA SISWA DAPODIK kelas X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Spinner Animasi Loading */
        .loader {
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-700 mb-2">Portal Pembaruan Data Siswa</h1>
            <p class="text-slate-600">Verifikasi dan lengkapi <strong>DATA SISWA DAPODIK kelas X</strong> Anda.</p>
        </header>

        <!-- Tempat Notifikasi (Alerts) -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-lg text-sm font-medium fade-in transition-all flex items-center justify-between">
            <span id="alertMessage"></span>
        </div>

        <!-- Bagian 1: Pencarian Data -->
        <div id="searchSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-6">
            <h2 class="text-xl font-semibold text-slate-800 mb-4 border-b pb-2">Langkah 1: Identifikasi Siswa</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">NISN (Nomor Induk Siswa Nasional)</label>
                    <input type="text" id="inputNisn" placeholder="Masukkan 10 digit NISN..." class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="inputNama" placeholder="Masukkan nama sesuai ijazah sebelumnya..." class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                <button id="btnSearch" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-all active:scale-95 flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                    <span id="btnSearchText">Cek Data Saya</span>
                    <div id="btnSearchLoader" class="hidden w-5 h-5 border-2 border-white rounded-full loader"></div>
                </button>
            </div>
        </div>

        <!-- Bagian 2: Form Pengisian / Pembaruan Data (Awalnya Disembunyikan) -->
        <div id="formSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 hidden fade-in">
            <h2 class="text-xl font-semibold text-slate-800 mb-4 border-b pb-2">Langkah 2: Lengkapi Data Dapodik</h2>
            <p class="text-sm text-slate-500 mb-6">Isi bagian yang masih kosong dan perbaiki jika ada yang salah. Data akan langsung diperbarui ke database sekolah.</p>
            
            <form id="studentForm" class="space-y-5">
                <!-- Data ini di-generate secara dinamis dari Google Spreadsheet -->
                <div id="dynamicFields" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Input Fields akan dimasukkan ke sini -->
                </div>

                <div class="pt-6 border-t mt-6 flex flex-col md:flex-row gap-3">
                    <button type="button" id="btnCancel" class="w-full md:w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-6 rounded-lg transition-all active:scale-95">
                        Batal
                    </button>
                    <button type="submit" id="btnSave" class="w-full md:w-2/3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-all active:scale-95 flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                        <span id="btnSaveText">Simpan ke Spreadsheet</span>
                        <div id="btnSaveLoader" class="hidden w-5 h-5 border-2 border-white rounded-full loader"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // =========================================================================
        // PENTING: GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        // =========================================================================
        const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRuZt6e3LKp4KKT1ihCUFWwKy9ihI6XH9xbZLojDtYlVzal15MWapiN5hzKdIIC-0ykw/exec'; 

        // State management
        let currentStudentRow = -1; 
        let currentHeaders = [];

        // Fungsi untuk menampilkan Alert UI
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            
            alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800', 'bg-blue-100', 'text-blue-800');
            
            if(type === 'error') alertBox.classList.add('bg-red-100', 'text-red-800');
            else if(type === 'success') alertBox.classList.add('bg-green-100', 'text-green-800');
            else alertBox.classList.add('bg-blue-100', 'text-blue-800');
            
            alertMessage.innerHTML = message;
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        // Event Pencarian Siswa (GET ke AppScript)
        document.getElementById('btnSearch').addEventListener('click', async function() {
            if (APPSCRIPT_URL.includes('SAMPLE_UBAH_DISINI')) {
                showAlert('Error: URL Google Apps Script belum disetel oleh Admin.', 'error');
                return;
            }

            const inputNisn = document.getElementById('inputNisn').value.trim();
            const inputNama = document.getElementById('inputNama').value.trim();

            if (!inputNisn || !inputNama) {
                showAlert('Mohon isi NISN dan Nama terlebih dahulu.', 'error');
                return;
            }

            // Ubah UI menjadi Loading
            hideAlert();
            const btnSearch = document.getElementById('btnSearch');
            document.getElementById('btnSearchText').innerText = "Mencari Data...";
            document.getElementById('btnSearchLoader').classList.remove('hidden');
            btnSearch.disabled = true;

            try {
                // Fetch data dari Google Sheets via GET request
                const response = await fetch(`${APPSCRIPT_URL}?action=search&nisn=${encodeURIComponent(inputNisn)}&nama=${encodeURIComponent(inputNama)}`);
                const result = await response.json();

                if (result.status === 'success') {
                    showAlert('Data berhasil ditemukan! Silakan lengkapi form di bawah.', 'success');
                    currentStudentRow = result.row;
                    currentHeaders = result.headers;
                    
                    renderForm(result.data, currentHeaders);
                    
                    document.getElementById('searchSection').classList.add('hidden');
                    document.getElementById('formSection').classList.remove('hidden');
                } else {
                    showAlert(result.message || 'Data tidak ditemukan di database.', 'error');
                }
            } catch (error) {
                console.error(error);
                showAlert('Gagal terhubung ke server. Periksa koneksi internet Anda.', 'error');
            } finally {
                // Kembalikan UI Button
                document.getElementById('btnSearchText').innerText = "Cek Data Saya";
                document.getElementById('btnSearchLoader').classList.add('hidden');
                btnSearch.disabled = false;
            }
        });

        // Membuat Input Fields secara dinamis berdasarkan respon Spreadsheet
        function renderForm(studentData, headers) {
            const container = document.getElementById('dynamicFields');
            container.innerHTML = ''; // Kosongkan form sebelumnya

            headers.forEach(header => {
                if(!header) return; // Lewati kolom kosong tanpa header

                const value = studentData[header] || '';
                
                // Kunci field utama agar tidak diubah secara bebas oleh siswa
                const headerLower = header.toLowerCase();
                const isReadOnly = headerLower === 'nisn' || headerLower === 'nama';
                
                // Tentukan tipe input
                let inputType = 'text';
                if(headerLower.includes('tanggal') || headerLower.includes('tgl')) inputType = 'date';
                
                const div = document.createElement('div');
                // Elemen alamat biasanya butuh space lebih luas
                if(headerLower.includes('alamat')) {
                    div.className = "md:col-span-2";
                }

                div.innerHTML = `
                    <label class="block text-sm font-medium text-slate-700 mb-1">${header}</label>
                    <input type="${inputType}" name="${header}" value="${value}" 
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all ${isReadOnly ? 'bg-slate-100 cursor-not-allowed text-slate-500' : 'bg-white'}"
                        ${isReadOnly ? 'readonly' : ''}
                        placeholder="${isReadOnly ? '' : 'Isi ' + header + '...'}"
                    >
                `;
                container.appendChild(div);
            });
        }

        // Tombol Batal
        document.getElementById('btnCancel').addEventListener('click', function() {
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('searchSection').classList.remove('hidden');
            document.getElementById('inputNisn').value = '';
            document.getElementById('inputNama').value = '';
            currentStudentRow = -1;
            hideAlert();
        });

        // Event Menyimpan Form ke Google Spreadsheet
        document.getElementById('studentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if(currentStudentRow === -1) return;

            const formData = new FormData(e.target);
            const dataToUpdate = {};
            
            // Konversi FormData ke plain object
            for(let [key, value] of formData.entries()) {
                dataToUpdate[key] = value.trim();
            }

            // Payload untuk dikirim ke GAS
            const payload = {
                action: 'update',
                row: currentStudentRow,
                data: dataToUpdate
            };

            // Ubah UI Button menjadi proses Loading
            const btnSave = document.getElementById('btnSave');
            document.getElementById('btnSaveText').innerText = "Menyimpan Data...";
            document.getElementById('btnSaveLoader').classList.remove('hidden');
            btnSave.disabled = true;

            try {
                // Gunakan text/plain method untuk melewati pembatasan preflight CORS browser ke Apps Script
                const response = await fetch(APPSCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if(result.status === 'success') {
                    showAlert('Data berhasil disimpan ke Spreadsheet sekolah!', 'success');
                    
                    // Otomatis kembali ke halaman awal setelah 3 detik
                    setTimeout(() => {
                        document.getElementById('btnCancel').click();
                        showAlert('Pembaruan selesai. Anda dapat mencari data siswa lain.', 'success');
                    }, 3000);
                } else {
                    showAlert('Gagal menyimpan: ' + result.message, 'error');
                }
            } catch (error) {
                console.error(error);
                showAlert('Terjadi kesalahan saat menyimpan data. Cek koneksi Anda.', 'error');
            } finally {
                // Kembalikan UI button
                document.getElementById('btnSaveText').innerText = "Simpan ke Spreadsheet";
                document.getElementById('btnSaveLoader').classList.add('hidden');
                btnSave.disabled = false;
            }
        });
    </script>
</body>
</html>
